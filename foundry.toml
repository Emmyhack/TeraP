[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
# "paris" avoids PUSH0/MCOPY/TSTORE so bytecode runs on ZetaChain's EVM without assuming Cancun support.
# OpenZeppelin submodules are pinned to v5.1.0: 5.3+ uses `mcopy`, which requires evm_version = "cancun".
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
ast = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 2000 }

[fmt]
line_length = 120
tab_width = 4
